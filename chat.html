<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d0d; --paper: #f5f0e8; --cream: #ede7d9;
      --accent: #c8502a; --accent-dim: #e8d5cc; --muted: #7a7060;
      --border: #c5bba8; --surface: #fff;
      --self-bg: #0d0d0d; --self-text: #f5f0e8;
      --other-bg: #fff;   --other-text: #0d0d0d;
    }

    [data-theme="dark"] {
      --ink: #f0ebe0; --paper: #141210; --cream: #1e1b17;
      --accent: #e0673d; --accent-dim: #3a2218; --muted: #8a8070;
      --border: #3a342a; --surface: #1e1b17;
      --self-bg: #e0673d; --self-text: #fff;
      --other-bg: #2a2520; --other-text: #f0ebe0;
    }

    html, body { height: 100%; font-family: 'DM Mono', monospace; background: var(--paper); color: var(--ink); transition: background .2s, color .2s; }

    .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; max-width: 860px; margin: 0 auto; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface); gap: 12px; position: relative; z-index: 10;
    }

    .header-left { display: flex; align-items: baseline; gap: 12px; }

    .logo { font-family: 'DM Serif Display', serif; font-size: 1.45rem; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }

    .room-tag { font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .user-chip {
      display: flex; align-items: center; gap: 7px; font-size: .7rem; color: var(--muted);
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 2px; background: var(--cream);
      cursor: pointer; transition: border-color .15s;
      position: relative;
    }
    .user-chip:hover { border-color: var(--ink); }

    .avatar { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .58rem; color: #fff; flex-shrink: 0; font-weight: 500; }

    /* Profile dropdown */
    .dropdown {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
      box-shadow: 4px 4px 0 var(--border); min-width: 180px;
      z-index: 100; display: none;
    }
    .dropdown.open { display: block; }
    .dropdown-header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .dropdown-header .dn { font-size: .82rem; font-weight: 500; }
    .dropdown-header .un { font-size: .65rem; color: var(--muted); margin-top: 2px; }
    .dropdown-item {
      display: block; width: 100%; text-align: left; padding: 10px 14px;
      font-family: 'DM Mono', monospace; font-size: .72rem; color: var(--muted);
      background: none; border: none; cursor: pointer; letter-spacing: .06em;
      border-top: 1px solid var(--border); transition: background .1s, color .1s;
    }
    .dropdown-item:hover { background: var(--cream); color: var(--ink); }
    .dropdown-item.danger:hover { color: var(--accent); }

    .icon-btn {
      background: none; border: 1px solid var(--border); border-radius: 2px;
      color: var(--muted); cursor: pointer; padding: 6px 10px; font-size: 1rem; line-height: 1;
      transition: border-color .15s, color .15s, background .15s;
    }
    .icon-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--cream); }

    /* Status bar */
    .status-bar {
      padding: 4px 20px; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); background: var(--cream); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }

    .status-dot { width: 5px; height: 5px; border-radius: 50%; }
    .status-dot.green { background: #4caf50; animation: blink 2.5s ease-in-out infinite; }
    .status-dot.red   { background: #e74c3c; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Messages ── */
    #chat { overflow-y: auto; padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 2px; scroll-behavior: smooth; }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .day-divider {
      display: flex; align-items: center; gap: 10px; margin: 14px 0 10px;
      font-size: .58rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted);
    }
    .day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .history-separator {
      display: flex; align-items: center; gap: 10px; margin: 14px 0 10px;
      font-size: .58rem; letter-spacing: .1em; color: var(--accent); font-style: italic;
    }
    .history-separator::before, .history-separator::after { content: ''; flex: 1; height: 1px; background: var(--accent-dim); }

    .msg-row { display: flex; flex-direction: column; max-width: 72%; animation: msgIn .18s ease both; }
    .msg-row.self  { align-self: flex-end;   align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-row.system-row { align-self: center; max-width: 100%; }

    @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .sender-label { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; padding: 0 4px; }

    .bubble { padding: 9px 14px; border-radius: 2px; font-size: .85rem; line-height: 1.55; word-break: break-word; }
    .msg-row.self  .bubble { background: var(--self-bg);  color: var(--self-text);  border-radius: 2px 2px 2px 10px; }
    .msg-row.other .bubble { background: var(--other-bg); color: var(--other-text); border: 1px solid var(--border); border-radius: 2px 2px 10px 2px; }
    .msg-row.history-msg .bubble { opacity: .55; }

    .msg-time { font-size: .57rem; color: var(--muted); padding: 2px 4px; opacity: 0; transition: opacity .15s; margin-top: 2px; }
    .msg-row:hover .msg-time { opacity: 1; }

    .system-bubble { font-size: .63rem; letter-spacing: .08em; color: var(--muted); padding: 4px 12px; background: var(--cream); border: 1px solid var(--border); border-radius: 20px; font-style: italic; }

    .msg-row.no-label .sender-label { display: none; }
    .msg-row.no-label { margin-top: 1px; }

    /* ── Typing ── */
    #typingIndicator { padding: 3px 20px; font-size: .63rem; font-style: italic; color: var(--muted); min-height: 20px; letter-spacing: .05em; }
    .typing-dots { display: inline-flex; gap: 3px; vertical-align: middle; }
    .typing-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: dotBounce 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-4px);opacity:1} }

    /* ── Input ── */
    #inputArea { border-top: 1px solid var(--border); background: var(--surface); padding: 10px 16px 14px; }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }

    #messageInput {
      flex: 1; font-family: 'DM Mono', monospace; font-size: .875rem;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 2px;
      background: var(--paper); color: var(--ink); outline: none;
      resize: none; min-height: 42px; max-height: 120px; line-height: 1.5;
      transition: border-color .15s, box-shadow .15s;
    }
    #messageInput:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-dim); }
    #messageInput::placeholder { color: var(--border); }

    .send-btn {
      font-family: 'DM Mono', monospace; font-size: .75rem; letter-spacing: .1em;
      padding: 10px 18px; background: var(--ink); color: var(--paper);
      border: 1px solid var(--ink); border-radius: 2px; cursor: pointer;
      transition: background .15s, transform .1s; white-space: nowrap; height: 42px;
    }
    .send-btn:hover { background: var(--accent); border-color: var(--accent); }
    .send-btn:active { transform: scale(.97); }

    .input-meta { display: flex; justify-content: flex-end; padding-top: 4px; }
    .char-count { font-size: .58rem; color: var(--border); }
    .char-count.warn { color: var(--accent); }

    /* ── Connecting overlay ── */
    #connectingOverlay {
      position: fixed; inset: 0; background: var(--paper);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      z-index: 200; transition: opacity .3s;
    }
    #connectingOverlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Toast ── */
    #toast { position:fixed; bottom:80px; right:20px; background:var(--ink); color:var(--paper); font-size:.7rem; padding:10px 16px; border-radius:2px; opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; pointer-events:none; z-index:50; max-width:240px; }
    #toast.show { opacity:1; transform:translateY(0); }

    @media (max-width:540px) {
      .msg-row { max-width: 88%; }
      header { padding: 10px 14px; }
      #chat { padding: 12px 12px 4px; }
      #inputArea { padding: 8px 10px 12px; }
    }
  </style>
</head>
<body>

<div id="connectingOverlay">
  <div style="font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--ink)">Relay</div>
  <div class="spinner"></div>
  <div style="font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)">Connecting…</div>
</div>

<div id="toast"></div>

<div class="app">
  <div>
    <header>
      <div class="header-left">
        <span class="logo">Relay</span>
        <span class="room-tag"># general</span>
      </div>
      <div class="header-right">
        <!-- User chip + dropdown -->
        <div class="user-chip" id="userChip" onclick="toggleDropdown()">
          <div class="avatar" id="userAvatar"></div>
          <span id="usernameDisplay"></span>
          <span style="font-size:.65rem;opacity:.5">▾</span>

          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dn" id="dropDisplayName"></div>
              <div class="un" id="dropUsername"></div>
            </div>
            <button class="dropdown-item" onclick="toggleTheme(); event.stopPropagation()">Toggle Theme</button>
            <button class="dropdown-item danger" onclick="logout()">Sign Out</button>
          </div>
        </div>

        <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">☽</button>
      </div>
    </header>

    <div class="status-bar">
      <div class="status-dot green" id="statusDot"></div>
      <span id="statusText">Connected</span>
      <span style="margin-left:auto;opacity:.6" id="onlineCount"></span>
    </div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <div id="typingIndicator"></div>
    <div class="input-row">
      <textarea id="messageInput" placeholder="Message #general…" maxlength="2000" rows="1" autocomplete="off" spellcheck="true"></textarea>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="input-meta">
      <span class="char-count" id="charCount"></span>
    </div>
  </div>
</div>

<script src="relay-config.js"></script>
<script>
// ─── Auth gate ────────────────────────────────────────────────────────────────
const session = { token: Relay.getToken(), user: Relay.getUser() };
if (!session.token || !session.user) { window.location.href = 'index.html'; }

const { token, user } = session;
const { username, displayName } = user;
const sessionId = crypto.randomUUID();

// ─── DOM ──────────────────────────────────────────────────────────────────────
const chat            = document.getElementById('chat');
const messageInput    = document.getElementById('messageInput');
const statusDot       = document.getElementById('statusDot');
const statusText      = document.getElementById('statusText');
const onlineCountEl   = document.getElementById('onlineCount');
const typingIndicator = document.getElementById('typingIndicator');
const charCountEl     = document.getElementById('charCount');
const overlay         = document.getElementById('connectingOverlay');
const toastEl         = document.getElementById('toast');
const themeBtn        = document.getElementById('themeBtn');
const dropdown        = document.getElementById('dropdown');

// ─── Populate header ──────────────────────────────────────────────────────────
document.getElementById('usernameDisplay').textContent  = username;
document.getElementById('dropDisplayName').textContent  = displayName;
document.getElementById('dropUsername').textContent     = '@' + username;
const avatarEl = document.getElementById('userAvatar');
avatarEl.textContent   = (displayName || username).charAt(0).toUpperCase();
avatarEl.style.background = Relay.colorFor(username);

// ─── Theme ────────────────────────────────────────────────────────────────────
const savedTheme = localStorage.getItem('relay_theme') || 'light';
applyTheme(savedTheme);

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀' : '☽';
  localStorage.setItem('relay_theme', t);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// ─── Dropdown ─────────────────────────────────────────────────────────────────
function toggleDropdown() { dropdown.classList.toggle('open'); }
document.addEventListener('click', e => {
  if (!document.getElementById('userChip').contains(e.target)) dropdown.classList.remove('open');
});

// ─── Logout ───────────────────────────────────────────────────────────────────
function logout() {
  if (!confirm('Sign out of Relay?')) return;
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' }));
  Relay.clearSession();
  window.location.href = 'index.html';
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimeout;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
let socket, isConnected = false, reconnectTimer;
let historyRendered = false;
let lastSender = null, lastSenderIsHistory = null;
const typingUsers = new Map();

function connect() {
  const url = `${Relay.api.replace('https://', 'wss://').replace('http://', 'ws://')}/ws`
    + `?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}&sessionId=${sessionId}`;

  socket = new WebSocket(url);

  socket.onopen = () => {
    isConnected = true;
    overlay.classList.add('hidden');
    statusDot.className = 'status-dot green';
    statusText.textContent = 'Connected';
    clearTimeout(reconnectTimer);
  };

  socket.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'history')      { if (!historyRendered) renderHistory(data.messages); return; }
    if (data.type === 'online_count') { onlineCountEl.textContent = `${data.count} online`; return; }
    if (data.type === 'typing')       { handleTyping(data); return; }
    addMessage(data);
    if (data.username && data.username !== username && document.hidden && Notification.permission === 'granted') {
      new Notification(`Relay · ${data.username}`, { body: data.message, silent: true });
    }
  };

  socket.onclose = () => {
    isConnected = false;
    statusDot.className = 'status-dot red';
    statusText.textContent = 'Disconnected — reconnecting…';
    reconnectTimer = setTimeout(connect, 2500);
  };

  socket.onerror = () => socket.close();
}

connect();
setInterval(() => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'ping' })); }, 20000);
window.addEventListener('beforeunload', () => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' })); });
if (Notification.permission === 'default') Notification.requestPermission();

// ─── Render ───────────────────────────────────────────────────────────────────
function renderHistory(messages) {
  lastSender = null;
  for (const msg of messages) renderMessage(msg, true);
  const sep = document.createElement('div');
  sep.className = 'history-separator';
  sep.textContent = 'Earlier messages above · Live below';
  chat.appendChild(sep);
  lastSender = null;
  chat.scrollTop = chat.scrollHeight;
  historyRendered = true;
}

function addMessage(data) {
  renderMessage(data, false);
  chat.scrollTop = chat.scrollHeight;
}

function renderMessage(data, isHistory) {
  if (data.type === 'system' || data.type === 'join' || data.type === 'leave') {
    const wrap = document.createElement('div');
    wrap.className = 'msg-row system-row';
    const b = document.createElement('div');
    b.className = 'system-bubble';
    b.textContent = data.message || '';
    wrap.appendChild(b);
    chat.appendChild(wrap);
    lastSender = null;
    return;
  }

  const isSelf = data.username === username;
  const sameAsBefore = lastSender === data.username && lastSenderIsHistory === isHistory;
  lastSender = data.username;
  lastSenderIsHistory = isHistory;

  const row = document.createElement('div');
  row.className = ['msg-row', isSelf ? 'self' : 'other', isHistory ? 'history-msg' : '', sameAsBefore ? 'no-label' : ''].filter(Boolean).join(' ');

  if (!sameAsBefore) {
    const label = document.createElement('div');
    label.className = 'sender-label';
    if (!isSelf) {
      const dot = document.createElement('span');
      dot.style.cssText = `display:inline-block;width:6px;height:6px;border-radius:50%;background:${Relay.colorFor(data.username)};margin-right:5px;vertical-align:middle;`;
      label.appendChild(dot);
    }
    label.appendChild(document.createTextNode(isSelf ? 'You' : (data.displayName || data.username)));
    row.appendChild(label);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = data.message || '';
  row.appendChild(bubble);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date(data.time || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  row.appendChild(time);

  chat.appendChild(row);
}

// ─── Typing ───────────────────────────────────────────────────────────────────
function handleTyping(data) {
  if (data.username === username) return;
  if (typingUsers.has(data.username)) clearTimeout(typingUsers.get(data.username));
  typingUsers.set(data.username, setTimeout(() => { typingUsers.delete(data.username); updateTypingDisplay(); }, 3000));
  updateTypingDisplay();
}

function updateTypingDisplay() {
  const users = [...typingUsers.keys()];
  if (!users.length) { typingIndicator.innerHTML = ''; return; }
  const names = users.length === 1 ? users[0] : users.length === 2 ? `${users[0]} and ${users[1]}` : `${users[0]} and ${users.length - 1} others`;
  typingIndicator.innerHTML = `<span>${names} ${users.length === 1 ? 'is' : 'are'} typing</span> <span class="typing-dots"><span></span><span></span><span></span></span>`;
}

// ─── Send ─────────────────────────────────────────────────────────────────────
function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !isConnected) return;
  socket.send(JSON.stringify({ username, message: text }));
  messageInput.value = '';
  messageInput.style.height = 'auto';
  charCountEl.textContent = '';
  charCountEl.classList.remove('warn');
}

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  const len = messageInput.value.length;
  if (len > 1800) { charCountEl.textContent = `${2000 - len} remaining`; charCountEl.classList.add('warn'); }
  else { charCountEl.textContent = ''; charCountEl.classList.remove('warn'); }
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'typing', username }));
});

messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
