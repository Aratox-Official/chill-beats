<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay - Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #313338;
      --bg-dark:    #2b2d31;
      --bg-darker:  #1e1f22;
      --surface:    #383a40;
      --border:     #3f4147;
      --text:       #dbdee1;
      --text-muted: #949ba4;
      --text-dim:   #6d6f78;
      --accent:     #5865f2;
      --accent-dim: #4752c4;
      --green:      #23a55a;
      --red:        #f23f43;
      --mention:    rgba(88,101,242,0.1);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
    }

    /* -- App shell -- */
    .app {
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 1fr;
    }

    /* -- Sidebar -- */
    .sidebar {
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bg-darker);
      overflow: hidden;
    }

    .server-header {
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bg-darker);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .server-header:hover { background: var(--surface); }

    .channels-section {
      padding: 16px 8px 4px;
      flex: 1;
      overflow-y: auto;
    }

    .channels-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
    }

    .channel-item:hover { background: var(--surface); color: var(--text); }
    .channel-item.active { background: var(--surface); color: var(--text); }

    .channel-item .hash {
      font-size: 1.1rem;
      opacity: 0.6;
      flex-shrink: 0;
    }

    /* User panel at bottom of sidebar */
    .user-panel {
      padding: 8px;
      background: var(--bg-darker);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .user-panel .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
      position: relative;
    }

    .user-panel .avatar::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--bg-darker);
    }

    .user-panel .user-info { flex: 1; overflow: hidden; }
    .user-panel .user-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-panel .user-tag  { font-size: 0.7rem; color: var(--text-muted); }

    .user-panel .panel-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 1rem;
      transition: background 0.1s, color 0.1s;
    }
    .user-panel .panel-btn:hover { background: var(--surface); color: var(--text); }

    /* -- Main area -- */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* Channel header */
    .channel-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--bg-darker);
      flex-shrink: 0;
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .channel-header .hash { font-size: 1.4rem; color: var(--text-muted); }
    .channel-header .name { font-weight: 600; font-size: 0.95rem; }
    .channel-header .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .channel-header .topic { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .header-actions { margin-left: auto; display: flex; gap: 4px; }
    .header-btn {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 6px; border-radius: 4px; font-size: 1rem;
      transition: color 0.1s, background 0.1s;
    }
    .header-btn:hover { color: var(--text); background: var(--surface); }

    /* Status bar */
    .status-bar {
      padding: 2px 16px;
      font-size: 0.68rem;
      color: var(--text-dim);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.green { background: var(--green); }
    .status-dot.red   { background: var(--red); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* -- Messages -- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 3px; }
    #chat::-webkit-scrollbar-thumb:hover { background: var(--border); }

    /* History separator */
    .history-separator {
      display: flex; align-items: center; gap: 10px;
      margin: 8px 16px 16px;
      font-size: 0.72rem; color: var(--text-dim); font-style: italic;
    }
    .history-separator::before, .history-separator::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* System message */
    .system-msg {
      padding: 2px 48px;
      font-size: 0.78rem;
      color: var(--text-dim);
      font-style: italic;
      animation: fadeIn 0.15s ease;
    }

    /* Message group - Discord style */
    .msg-group {
      padding: 2px 16px;
      display: flex;
      gap: 16px;
      animation: fadeIn 0.15s ease;
      position: relative;
    }

    .msg-group:hover { background: rgba(0,0,0,0.06); }

    .msg-group.continued { padding-top: 1px; padding-bottom: 1px; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    /* Avatar column */
    .msg-avatar {
      width: 40px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .msg-avatar .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    .msg-avatar .avatar:hover { filter: brightness(0.85); }

    /* In continued messages, show timestamp on hover instead of avatar */
    .msg-group.continued .msg-avatar { display: flex; align-items: center; justify-content: flex-end; }
    .msg-group.continued .avatar { display: none; }
    .msg-group.continued .mini-time {
      display: block;
      font-size: 0.65rem;
      color: var(--text-dim);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.1s;
      font-family: 'DM Mono', monospace;
    }
    .msg-group.continued:hover .mini-time { opacity: 1; }
    .mini-time { display: none; }

    /* Message content column */
    .msg-content { flex: 1; min-width: 0; }

    .msg-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .msg-author {
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text);
    }
    .msg-author:hover { text-decoration: underline; }

    .msg-timestamp {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
    }

    .msg-text {
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-group.history-msg .msg-author,
    .msg-group.history-msg .msg-text { opacity: 0.5; }

    /* -- Typing indicator -- */
    #typingIndicator {
      height: 24px;
      padding: 0 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .typing-dots { display: inline-flex; gap: 3px; }
    .typing-dots span {
      width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted);
      animation: dotBounce 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dotBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

    /* -- Input area -- */
    .input-area {
      padding: 0 16px 20px;
      flex-shrink: 0;
    }

    .input-box {
      background: var(--surface);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      gap: 0;
      padding: 0 16px;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .input-box:focus-within { border-color: var(--accent); }

    #messageInput {
      flex: 1;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.94rem;
      padding: 11px 0;
      background: none;
      border: none;
      color: var(--text);
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      line-height: 1.5;
    }

    #messageInput::placeholder { color: var(--text-dim); }

    .send-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 8px 4px 8px 12px;
      font-size: 1.2rem;
      transition: color 0.1s;
      flex-shrink: 0;
      align-self: flex-end;
      margin-bottom: 8px;
    }
    .send-btn:hover { color: var(--accent); }
    .send-btn:disabled { color: var(--border); cursor: not-allowed; }

    .input-footer {
      padding: 4px 2px 0;
      font-size: 0.68rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    /* -- Connecting overlay -- */
    #overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 200; transition: opacity 0.3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.08em; }

    /* -- Responsive - collapse sidebar on mobile -- */
    @media (max-width: 600px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<div id="overlay">
  <div style="font-family:'DM Serif Display',serif;font-size:2rem;color:var(--text)">Relay</div>
  <div class="spinner"></div>
  <div class="overlay-text">Connecting…</div>
</div>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="server-header">
      <span>Relay</span>
      <span style="font-size:1.1rem">⌄</span>
    </div>

    <div class="channels-section">
      <div class="channels-label">Text Channels</div>
      <div class="channel-item active">
        <span class="hash">#</span>
        <span>general</span>
      </div>
    </div>

    <div class="user-panel">
      <div class="avatar" id="sidebarAvatar" style="width:32px;height:32px;font-size:0.8rem;font-weight:600;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;"></div>
      <div class="user-info">
        <div class="user-name" id="sidebarName"></div>
        <div class="user-tag" id="sidebarTag"></div>
      </div>
      <button class="panel-btn" title="Sign out" onclick="logout()">⏻</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="channel-header">
      <span class="hash">#</span>
      <span class="name">general</span>
      <span class="divider"></span>
      <span class="topic">Welcome to Relay</span>
      <div class="header-actions">
        <button class="header-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">☽</button>
        <span id="onlineCount" style="font-size:0.78rem;color:var(--text-muted);padding:4px 8px;"></span>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-dot green" id="statusDot"></div>
      <span id="statusText">Connected</span>
    </div>

    <div id="chat"></div>

    <div id="typingIndicator"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea
          id="messageInput"
          placeholder="Message #general"
          maxlength="2000"
          rows="1"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">➤</button>
      </div>
      <div class="input-footer">
        <span>Shift+Enter for new line</span>
        <span id="charCount"></span>
      </div>
    </div>
  </div>

</div>

<script src="relay-config.js"></script>
<script>
// --- Auth ---------------------------------------------------------------------
const token = Relay.getToken();
const user  = Relay.getUser();
if (!token || !user) { window.location.href = 'index.html'; }

const { username, displayName } = user;
const sessionId = crypto.randomUUID();

// --- DOM ----------------------------------------------------------------------
const chat            = document.getElementById('chat');
const messageInput    = document.getElementById('messageInput');
const statusDot       = document.getElementById('statusDot');
const statusText      = document.getElementById('statusText');
const onlineCountEl   = document.getElementById('onlineCount');
const typingIndicator = document.getElementById('typingIndicator');
const charCountEl     = document.getElementById('charCount');
const overlay         = document.getElementById('overlay');
const themeBtn        = document.getElementById('themeBtn');

// --- Sidebar user info --------------------------------------------------------
const sidebarAvatar = document.getElementById('sidebarAvatar');
sidebarAvatar.textContent   = (displayName || username).charAt(0).toUpperCase();
sidebarAvatar.style.background = Relay.colorFor(username);
document.getElementById('sidebarName').textContent = displayName || username;
document.getElementById('sidebarTag').textContent  = username;

// --- Theme --------------------------------------------------------------------
// Discord-style is always dark; light mode swaps to a softer palette
const themes = {
  dark: {
    '--bg': '#313338', '--bg-dark': '#2b2d31', '--bg-darker': '#1e1f22',
    '--surface': '#383a40', '--border': '#3f4147',
    '--text': '#dbdee1', '--text-muted': '#949ba4', '--text-dim': '#6d6f78',
    '--accent': '#5865f2',
  },
  light: {
    '--bg': '#ffffff', '--bg-dark': '#f2f3f5', '--bg-darker': '#e3e5e8',
    '--surface': '#ebedef', '--border': '#d1d3d7',
    '--text': '#2e3338', '--text-muted': '#5c5f66', '--text-dim': '#96989d',
    '--accent': '#5865f2',
  },
};

let currentTheme = localStorage.getItem('relay_theme') || 'dark';
applyTheme(currentTheme);

function applyTheme(t) {
  const vars = themes[t];
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
  themeBtn.textContent = t === 'dark' ? '☀' : '☽';
  localStorage.setItem('relay_theme', t);
  currentTheme = t;
}

function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

// --- Logout -------------------------------------------------------------------
function logout() {
  if (!confirm('Sign out of Relay?')) return;
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' }));
  Relay.clearSession();
  window.location.href = 'index.html';
}

// --- WebSocket ----------------------------------------------------------------
let socket, isConnected = false, reconnectTimer;
let historyRendered = false;
const typingUsers = new Map();

// Track last rendered message for grouping
let lastAuthor = null, lastTime = 0, lastIsHistory = null;
const GROUP_THRESHOLD = 5 * 60 * 1000; // 5 minutes

function connect() {
  const wsBase = Relay.api.replace('https://', 'wss://').replace('http://', 'ws://');
  const url = `${wsBase}/ws?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}&sessionId=${sessionId}`;
  socket = new WebSocket(url);

  socket.onopen = () => {
    isConnected = true;
    overlay.classList.add('hidden');
    statusDot.className = 'status-dot green';
    statusText.textContent = 'Connected';
    clearTimeout(reconnectTimer);
  };

  socket.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'history')      { if (!historyRendered) renderHistory(data.messages); return; }
    if (data.type === 'online_count') { onlineCountEl.textContent = `${data.count} online`; return; }
    if (data.type === 'typing')       { handleTyping(data); return; }
    addMessage(data, false);
    if (data.username && data.username !== username && document.hidden && Notification.permission === 'granted') {
      new Notification(`#general - ${data.displayName || data.username}`, { body: data.message, silent: true });
    }
  };

  socket.onclose = () => {
    isConnected = false;
    statusDot.className = 'status-dot red';
    statusText.textContent = 'Disconnected - reconnecting…';
    reconnectTimer = setTimeout(connect, 2500);
  };

  socket.onerror = () => socket.close();
}

connect();
setInterval(() => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'ping' })); }, 20000);
window.addEventListener('beforeunload', () => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' })); });
if (Notification.permission === 'default') Notification.requestPermission();

// --- Render history -----------------------------------------------------------
function renderHistory(messages) {
  lastAuthor = null; lastTime = 0;
  for (const msg of messages) addMessage(msg, true);

  const sep = document.createElement('div');
  sep.className = 'history-separator';
  sep.textContent = 'Earlier messages above · Live below';
  chat.appendChild(sep);

  lastAuthor = null; lastTime = 0; lastIsHistory = null;
  chat.scrollTop = chat.scrollHeight;
  historyRendered = true;
}

// --- Core render -------------------------------------------------------------
function addMessage(data, isHistory) {
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

  if (data.type === 'system' || data.type === 'join' || data.type === 'leave') {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = data.message || '';
    chat.appendChild(div);
    lastAuthor = null; lastTime = 0;
    if (atBottom || !isHistory) chat.scrollTop = chat.scrollHeight;
    return;
  }

  const msgTime = data.time || Date.now();
  const author  = data.username || 'Anonymous';
  const isContinued = author === lastAuthor
    && lastIsHistory === isHistory
    && (msgTime - lastTime) < GROUP_THRESHOLD;

  lastAuthor = author; lastTime = msgTime; lastIsHistory = isHistory;

  const group = document.createElement('div');
  group.className = ['msg-group', isContinued ? 'continued' : '', isHistory ? 'history-msg' : ''].filter(Boolean).join(' ');

  // Avatar / mini-time column
  const avatarCol = document.createElement('div');
  avatarCol.className = 'msg-avatar';

  if (isContinued) {
    const miniTime = document.createElement('span');
    miniTime.className = 'mini-time';
    miniTime.textContent = formatTime(msgTime);
    avatarCol.appendChild(miniTime);
  } else {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = (data.displayName || author).charAt(0).toUpperCase();
    av.style.background = Relay.colorFor(author);
    avatarCol.appendChild(av);
  }

  // Content column
  const contentCol = document.createElement('div');
  contentCol.className = 'msg-content';

  if (!isContinued) {
    const header = document.createElement('div');
    header.className = 'msg-header';

    const authorEl = document.createElement('span');
    authorEl.className = 'msg-author';
    authorEl.textContent = data.displayName || author;
    authorEl.style.color = Relay.colorFor(author);

    const timeEl = document.createElement('span');
    timeEl.className = 'msg-timestamp';
    timeEl.textContent = formatDateTime(msgTime);

    header.appendChild(authorEl);
    header.appendChild(timeEl);
    contentCol.appendChild(header);
  }

  const textEl = document.createElement('div');
  textEl.className = 'msg-text';
  textEl.textContent = data.message || '';
  contentCol.appendChild(textEl);

  group.appendChild(avatarCol);
  group.appendChild(contentCol);
  chat.appendChild(group);

  if (atBottom || !isHistory) chat.scrollTop = chat.scrollHeight;
}

// --- Typing -------------------------------------------------------------------
function handleTyping(data) {
  if (data.username === username) return;
  if (typingUsers.has(data.username)) clearTimeout(typingUsers.get(data.username));
  typingUsers.set(data.username, setTimeout(() => { typingUsers.delete(data.username); updateTypingDisplay(); }, 3000));
  updateTypingDisplay();
}

function updateTypingDisplay() {
  const users = [...typingUsers.keys()];
  if (!users.length) { typingIndicator.innerHTML = ''; return; }
  const names = users.length === 1 ? users[0]
    : users.length === 2 ? `${users[0]} and ${users[1]}`
    : `${users[0]} and ${users.length - 1} others`;
  typingIndicator.innerHTML = `
    <span class="typing-dots"><span></span><span></span><span></span></span>
    <span><strong>${names}</strong> ${users.length === 1 ? 'is' : 'are'} typing…</span>
  `;
}

// --- Send ---------------------------------------------------------------------
function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !isConnected) return;
  socket.send(JSON.stringify({ username, message: text }));
  messageInput.value = '';
  messageInput.style.height = 'auto';
  charCountEl.textContent = '';
}

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';

// --- Helpers ------------------------------------------------------------------
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDateTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString())
    return 'Today at ' + formatTime(ts);
  if (d.toDateString() === yesterday.toDateString())
    return 'Yesterday at ' + formatTime(ts);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + formatTime(ts);
}
