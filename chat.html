<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay - Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d0d; --paper: #f5f0e8; --cream: #ede7d9;
      --accent: #c8502a; --accent-dim: #e8d5cc; --muted: #7a7060;
      --border: #c5bba8; --surface: #fff;
    }

    [data-theme="dark"] {
      --ink: #f0ebe0; --paper: #141210; --cream: #1e1b17;
      --accent: #e0673d; --accent-dim: #3a2218; --muted: #8a8070;
      --border: #3a342a; --surface: #1e1b17;
    }

    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--paper); color: var(--ink);
      transition: background 0.2s, color 0.2s;
    }

    .app { height: 100vh; width: 100vw; display: flex; flex-direction: column; }

    /* -- Header -- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 48px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px;
    }

    .header-left { display: flex; align-items: baseline; gap: 12px; }

    .logo {
      font-family: 'DM Serif Display', serif; font-size: 1.4rem;
      letter-spacing: -0.02em; color: var(--ink); text-decoration: none;
    }

    .room-tag {
      font-family: 'DM Mono', monospace; font-size: .6rem;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .user-chip {
      display: flex; align-items: center; gap: 7px;
      font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted);
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 2px;
      background: var(--cream); position: relative; cursor: pointer;
      transition: border-color .15s;
    }
    .user-chip:hover { border-color: var(--ink); }

    .chip-avatar {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .58rem; font-weight: 600; color: #fff; flex-shrink: 0;
    }

    /* Dropdown */
    .dropdown {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 2px; box-shadow: 4px 4px 0 var(--border);
      min-width: 170px; z-index: 100; display: none;
    }
    .dropdown.open { display: block; }
    .dropdown-header { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .dropdown-header .dn { font-size: .82rem; font-weight: 600; }
    .dropdown-header .un { font-size: .65rem; color: var(--muted); margin-top: 1px; font-family: 'DM Mono', monospace; }
    .dropdown-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left; padding: 9px 14px;
      font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted);
      background: none; border: none; border-top: 1px solid var(--border);
      cursor: pointer; letter-spacing: .06em; transition: background .1s, color .1s;
    }
    .dropdown-item:hover { background: var(--cream); color: var(--ink); }
    .dropdown-item.danger:hover { color: var(--accent); }

    .icon-btn {
      background: none; border: 1px solid var(--border); border-radius: 2px;
      color: var(--muted); cursor: pointer; padding: 5px 9px; font-size: .95rem;
      transition: border-color .15s, color .15s, background .15s;
    }
    .icon-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--cream); }

    /* -- Status bar -- */
    .status-bar {
      padding: 3px 20px; font-family: 'DM Mono', monospace;
      font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); background: var(--cream);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.green { background: #4caf50; animation: blink 2.5s ease-in-out infinite; }
    .status-dot.red   { background: #e74c3c; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* -- Messages -- */
    #chat {
      flex: 1; overflow-y: auto; padding: 16px 0 8px;
      display: flex; flex-direction: column; min-height: 0;
    }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .history-separator {
      display: flex; align-items: center; gap: 10px;
      margin: 8px 20px 16px;
      font-family: 'DM Mono', monospace; font-size: .6rem;
      color: var(--accent); font-style: italic;
    }
    .history-separator::before, .history-separator::after {
      content: ''; flex: 1; height: 1px; background: var(--accent-dim);
    }

    .system-msg {
      padding: 2px 20px 2px 76px;
      font-size: .78rem; color: var(--muted); font-style: italic;
      animation: msgIn .15s ease;
    }

    .msg-group {
      padding: 2px 20px; display: flex; gap: 16px;
      animation: msgIn .15s ease;
    }
    .msg-group:hover { background: rgba(0,0,0,0.04); }
    [data-theme="dark"] .msg-group:hover { background: rgba(255,255,255,0.03); }
    .msg-group.continued { padding-top: 1px; padding-bottom: 1px; }
    .msg-group.history-msg { opacity: .5; }

    @keyframes msgIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    .msg-avatar-col {
      width: 40px; flex-shrink: 0; padding-top: 2px;
      display: flex; justify-content: center;
    }
    .msg-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .msg-group.continued .msg-avatar { display: none; }

    .mini-time {
      display: none; font-family: 'DM Mono', monospace;
      font-size: .6rem; color: var(--muted); white-space: nowrap;
      opacity: 0; transition: opacity .1s; padding-top: 3px;
    }
    .msg-group.continued .mini-time { display: block; }
    .msg-group.continued:hover .mini-time { opacity: 1; }

    .msg-content { flex: 1; min-width: 0; }
    .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .msg-author { font-weight: 600; font-size: .94rem; }
    .msg-timestamp { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--muted); }
    .msg-text { font-size: .92rem; line-height: 1.55; color: var(--ink); word-break: break-word; white-space: pre-wrap; }

    /* -- Typing indicator -- */
    #typingIndicator {
      height: 22px; padding: 0 20px 0 76px;
      font-size: .75rem; color: var(--muted);
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .typing-dots { display: inline-flex; gap: 3px; }
    .typing-dots span {
      width: 4px; height: 4px; border-radius: 50%; background: var(--muted);
      animation: dotBounce 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .16s; }
    .typing-dots span:nth-child(3) { animation-delay: .32s; }
    @keyframes dotBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

    /* -- Input area -- */
    .input-area { padding: 0 20px 16px; flex-shrink: 0; }
    .input-box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--cream); border: 1px solid var(--border);
      border-radius: 2px; padding: 0 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    .input-box:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-dim); }

    #messageInput {
      flex: 1; font-family: 'DM Sans', sans-serif; font-size: .92rem;
      padding: 11px 0; background: none; border: none; color: var(--ink);
      outline: none; resize: none; min-height: 44px; max-height: 180px; line-height: 1.5;
    }
    #messageInput::placeholder { color: var(--border); }

    .send-btn {
      font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .08em;
      padding: 7px 14px; background: var(--ink); color: var(--paper);
      border: none; border-radius: 2px; cursor: pointer;
      transition: background .15s; flex-shrink: 0; margin-bottom: 8px;
    }
    .send-btn:hover { background: var(--accent); }
    .send-btn:active { transform: scale(.97); }

    .input-footer {
      padding: 4px 2px 0; font-family: 'DM Mono', monospace;
      font-size: .6rem; color: var(--muted);
      display: flex; justify-content: space-between;
    }
    .char-warn { color: var(--accent); }

    /* -- Settings panel -- */
    .settings-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 300; display: none; align-items: center; justify-content: center;
    }
    .settings-backdrop.open { display: flex; }

    .settings-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 2px; width: min(420px, 92vw);
      box-shadow: 6px 6px 0 var(--border);
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .settings-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .settings-header h2 {
      font-family: 'DM Serif Display', serif; font-size: 1.15rem; font-weight: 400;
    }
    .settings-close {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 1.1rem; padding: 4px 8px; border-radius: 2px;
      transition: color .15s, background .15s;
    }
    .settings-close:hover { color: var(--ink); background: var(--cream); }

    .settings-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

    .setting-row { display: flex; flex-direction: column; gap: 8px; }
    .setting-label {
      font-family: 'DM Mono', monospace; font-size: .65rem;
      letter-spacing: .15em; text-transform: uppercase; color: var(--muted);
    }

    /* Color swatches */
    .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform .15s, border-color .15s;
      flex-shrink: 0;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.selected { border-color: var(--ink); transform: scale(1.1); }

    .color-custom { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .color-custom label {
      font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--muted);
    }
    .color-custom input[type="color"] {
      width: 36px; height: 28px; border: 1px solid var(--border);
      border-radius: 2px; cursor: pointer; background: none; padding: 2px;
    }

    /* Preview */
    .color-preview {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--cream);
      border: 1px solid var(--border); border-radius: 2px;
    }
    .preview-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; color: #fff; font-size: .9rem;
    }
    .preview-content { display: flex; flex-direction: column; gap: 2px; }
    .preview-name { font-weight: 600; font-size: .9rem; }
    .preview-text { font-size: .82rem; color: var(--muted); }

    /* Theme toggle row */
    .theme-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-pill {
      width: 44px; height: 24px; border-radius: 12px;
      background: var(--border); cursor: pointer; position: relative;
      border: none; transition: background .2s;
    }
    .toggle-pill.on { background: var(--accent); }
    .toggle-pill::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform .2s;
    }
    .toggle-pill.on::after { transform: translateX(20px); }

    .settings-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .btn-cancel {
      font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .08em;
      padding: 8px 16px; background: none; color: var(--muted);
      border: 1px solid var(--border); border-radius: 2px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }
    .btn-save {
      font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .08em;
      padding: 8px 16px; background: var(--ink); color: var(--paper);
      border: 1px solid var(--ink); border-radius: 2px; cursor: pointer;
      transition: background .15s;
    }
    .btn-save:hover { background: var(--accent); border-color: var(--accent); }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }

    /* -- Connecting overlay -- */
    #overlay {
      position: fixed; inset: 0; background: var(--paper);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 200; transition: opacity .3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: var(--ink); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="overlay">
  <div style="font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--ink)">Relay</div>
  <div class="spinner"></div>
  <div style="font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)">Connecting…</div>
</div>

<!-- Settings panel -->
<div class="settings-backdrop" id="settingsBackdrop" onclick="handleBackdropClick(event)">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-body">

      <!-- Theme -->
      <div class="setting-row">
        <div class="setting-label">Appearance</div>
        <div class="theme-row">
          <span style="font-size:.88rem">Dark mode</span>
          <button class="toggle-pill" id="themeToggle" onclick="toggleThemeFromSettings()"></button>
        </div>
      </div>

      <!-- Username color -->
      <div class="setting-row">
        <div class="setting-label">Username colour</div>
        <div class="color-swatches" id="colorSwatches"></div>
        <div class="color-custom">
          <label for="customColor">Custom</label>
          <input type="color" id="customColor" oninput="selectCustomColor(this.value)">
        </div>
      </div>

      <!-- Preview -->
      <div class="setting-row">
        <div class="setting-label">Preview</div>
        <div class="color-preview">
          <div class="preview-avatar" id="previewAvatar"></div>
          <div class="preview-content">
            <div class="preview-name" id="previewName"></div>
            <div class="preview-text">This is what your messages look like.</div>
          </div>
        </div>
      </div>

    </div>
    <div class="settings-footer">
      <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      <button class="btn-save" id="saveBtn" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<div class="app">
  <header>
    <div class="header-left">
      <span class="logo">Relay</span>
      <span class="room-tag"># general</span>
    </div>
    <div class="header-right">
      <div class="user-chip" id="userChip" onclick="toggleDropdown()">
        <div class="chip-avatar" id="chipAvatar"></div>
        <span id="chipName"></span>
        <span style="font-size:.6rem;opacity:.5">▾</span>
        <div class="dropdown" id="dropdown">
          <div class="dropdown-header">
            <div class="dn" id="dropDisplay"></div>
            <div class="un" id="dropUser"></div>
          </div>
          <button class="dropdown-item" onclick="openSettings(); event.stopPropagation()">
            ⚙ Settings
          </button>
          <button class="dropdown-item danger" onclick="logout()">⏻ Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-dot green" id="statusDot"></div>
    <span id="statusText">Connected</span>
    <span style="margin-left:auto" id="onlineCount"></span>
  </div>

  <div id="chat"></div>
  <div id="typingIndicator"></div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="messageInput" placeholder="Message #general" maxlength="2000" rows="1" autocomplete="off" spellcheck="true"></textarea>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="input-footer">
      <span>Shift+Enter for new line</span>
      <span id="charCount"></span>
    </div>
  </div>
</div>

<script src="relay-config.js"></script>
<script>
// --- Auth ---------------------------------------------------------------------
const token = Relay.getToken();
const user  = Relay.getUser();
if (!token || !user) { window.location.href = 'index.html'; }

const { username, displayName } = user;
const sessionId = crypto.randomUUID();

// --- Color palette ------------------------------------------------------------
const PALETTE = [
  '#c8502a','#e0673d','#2e6da4','#4a8c3f','#7b5ea7',
  '#b5892a','#3a7d7d','#a43a5c','#4a7ab5','#c4963a',
  '#5a9e6f','#9b4dca','#d4724a','#3d8fb5','#7a4a9e',
];

// --- State --------------------------------------------------------------------
// Color is fetched from the server on load; also cached in localStorage for speed
let myColor = localStorage.getItem(`relay_color_${username}`) || Relay.colorFor(username);
let pendingColor = myColor;

// Map of username → color (populated as messages arrive)
const userColors = {};

// --- DOM ----------------------------------------------------------------------
const chat            = document.getElementById('chat');
const messageInput    = document.getElementById('messageInput');
const statusDot       = document.getElementById('statusDot');
const statusText      = document.getElementById('statusText');
const onlineCountEl   = document.getElementById('onlineCount');
const typingIndicator = document.getElementById('typingIndicator');
const charCountEl     = document.getElementById('charCount');
const overlay         = document.getElementById('overlay');
const dropdown        = document.getElementById('dropdown');
const settingsBackdrop = document.getElementById('settingsBackdrop');
const themeToggle     = document.getElementById('themeToggle');

// --- Header init --------------------------------------------------------------
function refreshHeader() {
  const chipAvatar = document.getElementById('chipAvatar');
  chipAvatar.textContent = (displayName || username).charAt(0).toUpperCase();
  chipAvatar.style.background = myColor;
  document.getElementById('chipName').textContent    = displayName || username;
  document.getElementById('dropDisplay').textContent = displayName || username;
  document.getElementById('dropUser').textContent    = '@' + username;
}
refreshHeader();

// --- Fetch user color from server --------------------------------------------
async function fetchMyColor() {
  try {
    const res  = await fetch(`${Relay.api}/auth/me`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (data.color) {
      myColor = data.color;
      pendingColor = data.color;
      localStorage.setItem(`relay_color_${username}`, myColor);
      refreshHeader();
    }
  } catch {}
}
fetchMyColor();

// --- Theme --------------------------------------------------------------------
let currentTheme = localStorage.getItem('relay_theme') || 'dark';
applyTheme(currentTheme);

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('relay_theme', t);
  currentTheme = t;
  themeToggle.classList.toggle('on', t === 'dark');
}
function toggleThemeFromSettings() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

// --- Dropdown -----------------------------------------------------------------
function toggleDropdown() { dropdown.classList.toggle('open'); }
document.addEventListener('click', e => {
  if (!document.getElementById('userChip').contains(e.target)) dropdown.classList.remove('open');
});

// --- Settings -----------------------------------------------------------------
function buildSwatches() {
  const container = document.getElementById('colorSwatches');
  container.innerHTML = '';
  PALETTE.forEach(color => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (pendingColor === color ? ' selected' : '');
    sw.style.background = color;
    sw.title = color;
    sw.onclick = () => selectColor(color);
    container.appendChild(sw);
  });
}

function selectColor(color) {
  pendingColor = color;
  document.getElementById('customColor').value = color;
  buildSwatches();
  updatePreview();
}

function selectCustomColor(color) {
  pendingColor = color;
  // Deselect all swatches
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  updatePreview();
}

function updatePreview() {
  const av = document.getElementById('previewAvatar');
  av.textContent = (displayName || username).charAt(0).toUpperCase();
  av.style.background = pendingColor;
  const name = document.getElementById('previewName');
  name.textContent = displayName || username;
  name.style.color = pendingColor;
}

function openSettings() {
  dropdown.classList.remove('open');
  pendingColor = myColor;
  themeToggle.classList.toggle('on', currentTheme === 'dark');
  buildSwatches();
  document.getElementById('customColor').value = myColor;
  updatePreview();
  settingsBackdrop.classList.add('open');
}

function closeSettings() { settingsBackdrop.classList.remove('open'); }

function handleBackdropClick(e) {
  if (e.target === settingsBackdrop) closeSettings();
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch(`${Relay.api}/auth/color`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ color: pendingColor }),
    });
    if (!res.ok) throw new Error('Failed');

    myColor = pendingColor;
    localStorage.setItem(`relay_color_${username}`, myColor);
    userColors[username] = myColor;
    refreshHeader();

    // Re-color any already-rendered messages from this user
    document.querySelectorAll(`.msg-author[data-user="${username}"]`).forEach(el => {
      el.style.color = myColor;
    });
    document.querySelectorAll(`.msg-avatar[data-user="${username}"]`).forEach(el => {
      el.style.background = myColor;
    });

    closeSettings();
  } catch {
    alert('Could not save - please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

// --- Logout -------------------------------------------------------------------
function logout() {
  if (!confirm('Sign out of Relay?')) return;
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' }));
  Relay.clearSession();
  window.location.href = 'index.html';
}

// --- WebSocket ----------------------------------------------------------------
let socket, isConnected = false, reconnectTimer;
let historyRendered = false;
const typingUsers = new Map();
let lastAuthor = null, lastMsgTime = 0, lastIsHistory = null;
const GROUP_MS = 5 * 60 * 1000;

function connect() {
  const wsBase = Relay.api.replace('https://', 'wss://').replace('http://', 'ws://');
  const url = `${wsBase}/ws?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}&sessionId=${sessionId}`;
  socket = new WebSocket(url);

  socket.onopen = () => {
    isConnected = true;
    overlay.classList.add('hidden');
    statusDot.className = 'status-dot green';
    statusText.textContent = 'Connected';
    clearTimeout(reconnectTimer);
  };

  socket.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'history')      { if (!historyRendered) renderHistory(data.messages); return; }
    if (data.type === 'online_count') { onlineCountEl.textContent = `${data.count} online`; return; }
    if (data.type === 'typing')       { handleTyping(data); return; }
    addMessage(data, false);
    if (data.username && data.username !== username && document.hidden && Notification.permission === 'granted') {
      new Notification(`Relay · ${data.displayName || data.username}`, { body: data.message, silent: true });
    }
  };

  socket.onclose = () => {
    isConnected = false;
    statusDot.className = 'status-dot red';
    statusText.textContent = 'Disconnected - reconnecting…';
    reconnectTimer = setTimeout(connect, 2500);
  };

  socket.onerror = () => socket.close();
}

connect();
setInterval(() => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'ping' })); }, 20000);
window.addEventListener('beforeunload', () => { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'explicit_leave' })); });
if (Notification.permission === 'default') Notification.requestPermission();

// --- Color resolution ---------------------------------------------------------
// Fetches and caches a user's saved color from the server
const colorFetchCache = new Set();
async function resolveColor(uname) {
  if (userColors[uname]) return userColors[uname];
  if (uname === username) { userColors[uname] = myColor; return myColor; }
  if (colorFetchCache.has(uname)) return Relay.colorFor(uname);
  colorFetchCache.add(uname);
  try {
    const res  = await fetch(`${Relay.api}/auth/color/${encodeURIComponent(uname)}`);
    const data = await res.json();
    const color = data.color || Relay.colorFor(uname);
    userColors[uname] = color;
    // Retroactively update any already-rendered elements for this user
    document.querySelectorAll(`.msg-author[data-user="${uname}"]`).forEach(el => el.style.color = color);
    document.querySelectorAll(`.msg-avatar[data-user="${uname}"]`).forEach(el => el.style.background = color);
    return color;
  } catch {
    return Relay.colorFor(uname);
  }
}

// --- Render -------------------------------------------------------------------
function renderHistory(messages) {
  lastAuthor = null; lastMsgTime = 0; lastIsHistory = null;
  for (const msg of messages) addMessage(msg, true);
  const sep = document.createElement('div');
  sep.className = 'history-separator';
  sep.textContent = 'Earlier messages above · Live below';
  chat.appendChild(sep);
  lastAuthor = null; lastMsgTime = 0; lastIsHistory = null;
  chat.scrollTop = chat.scrollHeight;
  historyRendered = true;
}

function addMessage(data, isHistory) {
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

  if (data.type === 'system' || data.type === 'join' || data.type === 'leave') {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = data.message || '';
    chat.appendChild(div);
    lastAuthor = null; lastMsgTime = 0;
    if (atBottom || !isHistory) chat.scrollTop = chat.scrollHeight;
    return;
  }

  const msgTime = data.time || Date.now();
  const author  = data.username || 'Anonymous';
  const isContinued = author === lastAuthor
    && lastIsHistory === isHistory
    && (msgTime - lastMsgTime) < GROUP_MS;

  lastAuthor = author; lastMsgTime = msgTime; lastIsHistory = isHistory;

  // Use cached color or fallback immediately; async update will patch DOM
  const cachedColor = userColors[author] || (author === username ? myColor : Relay.colorFor(author));

  const group = document.createElement('div');
  group.className = ['msg-group', isContinued ? 'continued' : '', isHistory ? 'history-msg' : ''].filter(Boolean).join(' ');

  // Avatar col
  const avatarCol = document.createElement('div');
  avatarCol.className = 'msg-avatar-col';

  const miniTime = document.createElement('span');
  miniTime.className = 'mini-time';
  miniTime.textContent = formatTime(msgTime);
  avatarCol.appendChild(miniTime);

  if (!isContinued) {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.dataset.user = author;
    av.textContent = (data.displayName || author).charAt(0).toUpperCase();
    av.style.background = cachedColor;
    avatarCol.appendChild(av);
  }

  // Content col
  const contentCol = document.createElement('div');
  contentCol.className = 'msg-content';

  if (!isContinued) {
    const header = document.createElement('div');
    header.className = 'msg-header';

    const authorEl = document.createElement('span');
    authorEl.className = 'msg-author';
    authorEl.dataset.user = author;
    authorEl.textContent = data.displayName || author;
    authorEl.style.color = cachedColor;

    const timeEl = document.createElement('span');
    timeEl.className = 'msg-timestamp';
    timeEl.textContent = formatDateTime(msgTime);

    header.appendChild(authorEl);
    header.appendChild(timeEl);
    contentCol.appendChild(header);
  }

  const textEl = document.createElement('div');
  textEl.className = 'msg-text';
  textEl.textContent = data.message || '';
  contentCol.appendChild(textEl);

  group.appendChild(avatarCol);
  group.appendChild(contentCol);
  chat.appendChild(group);

  if (atBottom || !isHistory) chat.scrollTop = chat.scrollHeight;

  // Async: fetch real color and patch if different
  resolveColor(author);
}

// --- Typing -------------------------------------------------------------------
function handleTyping(data) {
  if (data.username === username) return;
  if (typingUsers.has(data.username)) clearTimeout(typingUsers.get(data.username));
  typingUsers.set(data.username, setTimeout(() => { typingUsers.delete(data.username); updateTypingDisplay(); }, 3000));
  updateTypingDisplay();
}

function updateTypingDisplay() {
  const users = [...typingUsers.keys()];
  if (!users.length) { typingIndicator.innerHTML = ''; return; }
  const names = users.length === 1 ? users[0]
    : users.length === 2 ? `${users[0]} and ${users[1]}`
    : `${users[0]} and ${users.length - 1} others`;
  typingIndicator.innerHTML = `
    <span class="typing-dots"><span></span><span></span><span></span></span>
    <span><strong>${names}</strong> ${users.length === 1 ? 'is' : 'are'} typing…</span>
  `;
}

// --- Send ---------------------------------------------------------------------
function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !isConnected) return;
  socket.send(JSON.stringify({ username, message: text }));
  messageInput.value = '';
  messageInput.style.height = 'auto';
  charCountEl.textContent = '';
  charCountEl.className = '';
}

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 180) + 'px';
  const len = messageInput.value.length;
  if (len > 1800) { charCountEl.textContent = `${2000 - len} remaining`; charCountEl.className = 'char-warn'; }
  else { charCountEl.textContent = ''; charCountEl.className = ''; }
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'typing', username }));
});

messageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// --- Helpers ------------------------------------------------------------------
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatDateTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString())     return 'Today at ' + formatTime(ts);
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday at ' + formatTime(ts);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' + formatTime(ts);
}
