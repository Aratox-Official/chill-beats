<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d0d; --paper: #f5f0e8; --cream: #ede7d9;
      --accent: #c8502a; --accent-dim: #e8d5cc; --muted: #7a7060;
      --border: #c5bba8; --surface: #fff;
    }

    html, body { height: 100%; font-family: 'DM Mono', monospace; background: var(--paper); color: var(--ink); overflow: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px; opacity: 0.15;
    }

    .page { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .wordmark { font-family: 'DM Serif Display', serif; font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -0.02em; margin-bottom: 4px; animation: fadeDown .5s ease both; }
    .tagline  { font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 44px; animation: fadeDown .5s .07s ease both; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
      padding: 36px 40px 40px; width: min(360px, 92vw);
      box-shadow: 4px 4px 0 var(--border), 8px 8px 0 var(--accent-dim);
      animation: fadeUp .5s .12s ease both;
    }

    .card-label { font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
    .card-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: .62rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }

    .field input {
      font-family: 'DM Mono', monospace; font-size: .9rem; padding: 11px 14px;
      border: 1px solid var(--border); background: var(--paper); color: var(--ink);
      border-radius: 2px; outline: none; transition: border-color .2s, box-shadow .2s; width: 100%;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .field input::placeholder { color: var(--border); }

    .error { font-size: .68rem; color: var(--accent); min-height: 1.2em; margin-top: 2px; letter-spacing: .04em; }

    .btn {
      font-family: 'DM Mono', monospace; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
      width: 100%; padding: 13px; background: var(--ink); color: var(--paper);
      border: 1px solid var(--ink); border-radius: 2px; cursor: pointer;
      transition: background .15s, transform .1s; margin-top: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { background: var(--cream); color: var(--border); border-color: var(--border); cursor: not-allowed; }
    .btn.loading::after { content: ' …'; }

    .footer-link { margin-top: 28px; font-size: .68rem; color: var(--muted); text-align: center; animation: fadeUp .5s .25s ease both; }
    .footer-link a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); padding-bottom: 1px; }
    .footer-link a:hover { border-bottom-color: var(--accent); }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
<div class="page">
  <div class="wordmark">Synapse</div>
  <div class="tagline">Sign in to your account</div>

  <div class="card">
    <div class="card-label">Login</div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="your_handle" autocomplete="username" autocorrect="off" spellcheck="false" maxlength="32">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="error" id="errorMsg"></div>

    <button class="btn" id="loginBtn" onclick="login()">Sign In →</button>
  </div>

  <div class="footer-link">
    No account? <a href="register.html">Create one</a>
  </div>
</div>

<script src="relay-config.js"></script>
<script>
  // If already logged in, skip to chat
  if (Relay.getToken() && Relay.getUser()) {
    window.location.href = 'chat.html';
  }

  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const errorEl    = document.getElementById('errorMsg');
  const loginBtn   = document.getElementById('loginBtn');

  function setError(msg) { errorEl.textContent = msg; }
  function setLoading(v) {
    loginBtn.disabled = v;
    loginBtn.classList.toggle('loading', v);
    loginBtn.textContent = v ? 'Signing in' : 'Sign In →';
  }

  async function login() {
    setError('');
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) { setError('Please fill in all fields.'); return; }

    setLoading(true);
    try {
      const res  = await fetch(`${Relay.api}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { setError(data.error || 'Login failed.'); setLoading(false); return; }

      Relay.saveSession(data.token, { username: data.username, displayName: data.displayName });
      window.location.href = 'chat.html';
    } catch {
      setError('Network error - please try again.');
      setLoading(false);
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
